name: Generate Profile Graphics

on:
  schedule:
    - cron: "0 */12 * * *"   # snake: every 12h
    - cron: "0 18 * * *"     # 3d-contrib: once daily (03:00 JST)
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  snake:
    runs-on: ubuntu-latest
    name: generate-snake
    permissions:
      contents: write
    steps:
      - name: Clone repo
        uses: actions/checkout@v3

      - name: Generate the snake files in ./dist/
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show build status
        run: git status

      - name: Push new files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  profile-3d-contrib:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated: 3d contrib"; then git push; fi

  # One-time setup for SUMMARY_GITHUB_TOKEN:
  # 1) Go to https://github.com/settings/tokens/new and create a classic PAT with `public_repo` scope.
  # 2) Open this repo -> Settings -> Secrets and variables -> Actions.
  # 3) Click "New repository secret".
  # 4) Name: SUMMARY_GITHUB_TOKEN
  # 5) Secret: paste the PAT value, then click "Add secret".
  summary-cards:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.SUMMARY_GITHUB_TOKEN || github.token }}

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || github.token }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 5
          AUTO_PUSH: false
          THEME: "tokyonight"

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "generated: profile summary cards"
            git push origin main
          fi
